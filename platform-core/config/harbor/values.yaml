# Harbor Helm Chart Values
# Based on: https://github.com/goharbor/harbor-helm

expose:
  # Set the way how to expose the service. Set the type as "ingress",
  # "clusterIP", "nodePort" or "loadBalancer" and fill the information
  # in the corresponding section
  type: clusterIP
  tls:
    # Enable the tls or not. Note: if the type is "ingress" and the tls
    # is disabled, the port must be 80 for http from outside
    enabled: false
    # The source of the tls certificate. Set it as "secret", "auto"
    # or "none"
    certSource: auto
    auto:
      # The common name used to generate the certificate. If not set, the hostname
      # will be used as the common name
      commonName: "harbor.local"
    secret:
      # The name of secret which contains keys named:
      # "tls.crt", "tls.key", "ca.crt"
      secretName: ""
      # The name of secret which contains keys named:
      # "tls.crt", "tls.key", "ca.crt"
      # This secret can not be managed by this chart
      notarySecretName: ""
  ingress:
    hosts:
      core: harbor.local
      notary: notary.harbor.local
    # set the ingressClassName
    className: "nginx"
    # set the ingress annotations
    annotations: {}
    # the ingress labels
    labels: {}
    # tls of the ingress
    tls:
      # secret name of the ingress tls
      # the secret should contain keys named:
      # "tls.crt", "tls.key", "ca.crt"
      core: ""
      notary: ""

# The persistence is enabled by default and a default StorageClass
# is needed in the k8s cluster
# for the images storage
persistence:
  enabled: true
  # Setting it to "keep" to avoid removing the PVCs during a helm delete
  # operation. Setting it to "delete" will delete the PVCs after the chart
  # deleted
  resourcePolicy: "keep"
  persistentVolumeClaim:
    registry:
      # Use the existing PVC which must be created manually before bound,
      # and specify the "subPath" if the PVC is shared with other components
      existingClaim: ""
      # Specify the "storageClass" used to provision the volume. Or the default
      # StorageClass will be used (the default).
      # If it does not exist, it is required
      storageClass: "standard"
      subPath: ""
      accessMode: ReadWriteOnce
      size: 10Gi
    jobservice:
      existingClaim: ""
      storageClass: "standard"
      subPath: ""
      accessMode: ReadWriteOnce
      size: 1Gi
    database:
      existingClaim: ""
      storageClass: "standard"
      subPath: ""
      accessMode: ReadWriteOnce
      size: 2Gi
    redis:
      existingClaim: ""
      storageClass: "standard"
      subPath: ""
      accessMode: ReadWriteOnce
      size: 1Gi
    trivy:
      existingClaim: ""
      storageClass: "standard"
      subPath: ""
      accessMode: ReadWriteOnce
      size: 1Gi

# The initial passwords of Harbor. Change it before production deployment
# NOTE: If this is set, Harbor will use this password as the initial password
# for the admin user. If not set, Harbor will generate a random password
# and print it in the logs.
# For security, we'll let Harbor generate a random password and retrieve it
# using kubectl logs
harborAdminPassword: HarborAdmin123!

# The update strategy for deployments
updateStrategy:
  type: RollingUpdate

# Configure resource requests and limits for Harbor components
# Suitable for single-node Kind cluster
resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: 1000m

# Resource requests and limits for individual components
core:
  resources:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 1Gi
      cpu: 1000m

jobservice:
  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 512Mi
      cpu: 500m

registry:
  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 512Mi
      cpu: 500m

portal:
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

database:
  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 512Mi
      cpu: 500m

redis:
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

trivy:
  enabled: false
  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 512Mi
      cpu: 500m

# Disable notary for simplicity (can be enabled later if needed)
notary:
  enabled: false

# Metrics configuration
metrics:
  enabled: false
  core:
    path: /metrics
    port: 9090
  registry:
    path: /metrics
    port: 9090
  exporter:
    path: /metrics
    port: 9091

# Log level
logLevel: info

# Storage quota for projects
# Set to -1 to disable quota
quota:
  enabled: false
  # Use absolute number to specify the storage quota for each project
  # e.g. 100 means 100GB
  perProject: -1

# Enable the proxy
proxy:
  httpProxy: ""
  httpsProxy: ""
  noProxy: ""
  # Components that should be affected by the proxy
  components:
    - core
    - jobservice
    - trivy
externalURL: http://localhost:30004
